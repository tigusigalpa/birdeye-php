name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # CodeQL does not support PHP. Analyze this repository's workflow
          # definitions instead; PHP code is covered by PHPStan and PHPUnit.
          languages: actions
      - name: Analyze
        uses: github/codeql-action/analyze@v4
